[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refluxion"
version = "0.1.0"
description = "A lightweight, Aspen-style process simulator for learning chemical process design"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "chemicals>=1.1", "thermo>=0.2", "fluids>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]
aspen = ["pywin32>=306"]   # Aspen Plus COM connector (Windows only)

[tool.setuptools.packages.find]
include = ["refluxion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
